<title>ELVT COACH, Cy</title><style>
:root{--bg:#FAF7F2;--panel:#FFFFFF;--panel2:#F4F0E9;--line:#E4DFD6;
--gold:#8A6F34;--gold-dim:#A58A4E;--gold-soft:rgba(138,111,52,.09);
--txt:#111111;--mut:#6E6A64;--mut2:#9A958D;--ok:#2F7D4F;--warn:#A8641F;--bad:#A33F36;--r:12px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font-size:15px;line-height:1.5;padding-bottom:40px;
 font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
.top{position:sticky;top:0;z-index:50;background:rgba(250,247,242,.94);backdrop-filter:blur(8px);
 border-bottom:1px solid var(--line);padding:11px 0;margin-bottom:14px}
.topin{max-width:560px;margin:0 auto;padding:0 14px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:9px}
.brand img{height:15px;width:auto;display:block}
.brand small{font-size:9px;letter-spacing:.2em;color:var(--mut);font-weight:600;text-transform:uppercase}
.rdy{font-size:9px;letter-spacing:.14em;border-radius:999px;padding:5px 12px;font-weight:700;text-transform:uppercase}
.rdy.g{background:rgba(47,125,79,.12);color:var(--ok)}
.rdy.y{background:rgba(168,100,31,.13);color:var(--warn)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:13px}
.eyebrow{font-size:9.5px;letter-spacing:.2em;font-weight:700;color:var(--gold);text-transform:uppercase;margin-bottom:7px}
h2{font-family:Georgia,'Times New Roman',serif;font-size:24px;font-weight:600;margin:0 0 4px;line-height:1.15}
.sub{font-size:12.5px;color:var(--mut);margin:0}

.info p,.flag p{margin:0 0 7px;font-size:13px;color:#3A3833;line-height:1.6}

.gold{color:var(--gold);font-weight:600}
.row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.rb{flex:1;min-width:0}.rn{font-size:14.5px;font-weight:600;line-height:1.3}
.rm{font-size:11.5px;color:var(--mut);margin-top:3px;line-height:1.45}
.tick{width:26px;height:26px;border:1.5px solid var(--line);border-radius:7px;flex:0 0 auto;
 background:transparent;cursor:pointer;position:relative;margin-top:1px}
.tick.on{background:var(--gold);border-color:var(--gold)}
.tick.on:after{content:'';position:absolute;left:8px;top:4px;width:6px;height:11px;
 border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.met{background:var(--panel2);border-radius:9px;padding:11px 9px;text-align:center;border:none;
 cursor:pointer;font-family:inherit;width:100%}
.met b{display:block;font-family:Georgia,serif;font-size:19px;color:var(--txt);line-height:1}
.met b.empty{color:var(--mut2);font-size:15px}
.met i{display:block;font-style:normal;font-size:8.5px;letter-spacing:.1em;color:var(--mut);
 text-transform:uppercase;margin-top:5px}
.met .dl{font-size:9px;color:var(--gold);margin-top:3px;font-weight:700}
.bar{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:9px 0}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.btn{display:block;width:100%;padding:14px;border-radius:9px;border:none;background:var(--gold);
 color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.alt{background:transparent;border:1.5px solid var(--line);color:var(--txt)}
.act{font-size:11px;padding:6px 11px;border-radius:7px;border:1px solid var(--line);
 background:transparent;color:var(--mut);cursor:pointer;font-family:inherit;font-weight:600}
.scale{display:flex;gap:4px;margin:7px 0 0}
.sc{flex:1;padding:9px 0;border:1px solid var(--line);border-radius:7px;background:transparent;
 font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--txt)}
.sc.on{background:var(--gold);border-color:var(--gold);color:#fff}
.qlab{font-size:12px;font-weight:600;margin:13px 0 0;color:var(--txt)}
.mask{position:fixed;inset:0;background:rgba(17,17,17,.42);backdrop-filter:blur(3px);z-index:100;
 display:none;align-items:flex-end;justify-content:center}
.mask.on{display:flex}
.sheet{background:var(--panel);border-radius:16px 16px 0 0;padding:22px 18px 30px;width:100%;
 max-width:560px;max-height:88vh;overflow-y:auto}
.sheet h3{font-family:Georgia,serif;font-size:21px;margin:0 0 6px;font-weight:600}
.ms{font-size:12.5px;color:var(--mut);margin:0 0 14px;line-height:1.55}
.form label{display:block;font-size:11px;letter-spacing:.1em;color:var(--mut);text-transform:uppercase;
 font-weight:700;margin:11px 0 5px}
.form input,.form select{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;
 background:var(--bg);color:var(--txt);font-size:15px;font-family:inherit}
.more{margin-top:12px}
.more summary{font-size:11px;letter-spacing:.14em;font-weight:700;color:var(--gold);
 text-transform:uppercase;cursor:pointer;list-style:none}
.more summary::-webkit-details-marker{display:none}
.more summary:after{content:'  +'}.more[open] summary:after{content:'  \2212'}
.trend{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.trend:last-child{border-bottom:none}
.trend span{color:var(--mut)}.trend b{font-weight:600}
.up{color:var(--ok)}.dn{color:var(--bad)}.flat{color:var(--mut)}
.pill{display:inline-block;font-size:9px;letter-spacing:.1em;padding:3px 8px;border-radius:99px;
 border:1px solid var(--line);color:var(--mut);text-transform:uppercase;font-weight:700}

.ex{padding:13px 0;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:none}
.exh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.exn{font-size:14.5px;font-weight:600;line-height:1.3}
.exs{font-size:11.5px;color:var(--mut);margin-top:3px}
.cue{font-size:11.5px;color:#3A3833;margin-top:6px;line-height:1.5}
.cue b{color:var(--gold);font-weight:700}
.lnk{font-size:11px;color:var(--gold);text-decoration:none;font-weight:700;
 border:1px solid var(--line);padding:5px 10px;border-radius:7px;display:inline-block;margin-top:7px}
.unv{font-size:10px;color:var(--warn);font-weight:700;margin-top:7px;display:block}
.cd{font-family:Georgia,serif;font-size:30px;color:var(--gold);line-height:1}

/* ---- running restructure: 33 mi/7 days -> ~17 mi/4 days. no increase for 3 weeks. ---- */
function runWeek(w){
 /* FOUR run days, which is what he was onboarded to: 16 miles across 4.
    easy3 is Sunday, the shortest and easiest run of the week, and it is the
    one that carries the difference between the three weekday runs and the
    weekly total. total is now derived, never hand written, so the number on
    his counter can never drift from the runs the app actually schedules. */
 const t=(easy1,easy2,easy3,long)=>({easy1,easy2,easy3,long,total:easy1+easy2+easy3+long});
 if(w<=2) return t(4,4,3,5);
 if(w===3)return t(4,4,3,6);
 if(w===4)return t(3,3,3,5);   // reduced week
 if(w<=6) return t(4,4,4,6);
 if(w===7)return t(4,4,4,7);
 if(w===8)return t(3,3,3,5);   // reduced
 if(w<=10)return t(4,4,4,7);
 if(w===11)return t(4,4,4,8);
 return t(4,4,3,6);
}
const PHASES=[
 {n:'LEARN + STABILIZE',w:[1,4],d:'Learn the machines. Restructure the running. Build a meal rhythm.'},
 {n:'BUILD',           w:[5,8],d:'Load goes up. Cooking gets simpler. One quality run if the knee is quiet.'},
 {n:'PROGRESS + INDEPENDENCE',w:[9,12],d:'Keep progressing, then learn to run it yourself.'}
];
function phaseOf(w){return PHASES.find(p=>w>=p.w[0]&&w<=p.w[1])||PHASES[0];}

function sessionFor(w,d){
 const r=runWeek(w);
 /* quality run does NOT arrive on a date. Darren unlocks it once the knee
    has been quiet and the running has settled. */
 const q=(w>=5)&&!!S.qualityOK;
 switch(d){
  case 0:return {k:'lift',t:'Full Body A',tpl:'A'};
  case 1:return {k:'run',t:'Easy run \u00b7 '+r.easy1+' mi',mi:r.easy1,hard:false};
  case 2:return {k:'lift',t:'Full Body B',tpl:'B'};
  case 3:return q?{k:'run',t:'Quality run \u00b7 '+r.easy2+' mi',mi:r.easy2,hard:true}
                 :{k:'run',t:'Easy run \u00b7 '+r.easy2+' mi',mi:r.easy2,hard:false};
  case 4:return {k:'lift',t:'Full Body C',tpl:'C'};
  case 5:return {k:'run',t:'Long easy run \u00b7 '+r.long+' mi',mi:r.long,hard:false};
  case 6:return {k:'run',t:'Recovery run \u00b7 '+r.easy3+' mi',mi:r.easy3,hard:false,recov:true};
  default:return {k:'rest',t:'Rest or easy walk'};
 }
}

/* DAY DIFFERENCE, DST SAFE.
   Two local midnights are 23 or 25 hours apart across a daylight saving
   change, so dividing elapsed milliseconds by 86400000 and flooring it
   loses a whole day when the clocks go forward. Comparing the calendar
   dates as UTC removes the clock from the arithmetic entirely. */
function dayDiff(a,b){
  const A=Date.UTC(a.getFullYear(),a.getMonth(),a.getDate());
  const B=Date.UTC(b.getFullYear(),b.getMonth(),b.getDate());
  return Math.round((A-B)/86400000);}
function todayIdx(){const n=new Date();n.setHours(0,0,0,0);

 return{w:Math.min(WEEKS,Math.floor(diff/7)+1),d:Math.min(6,diff%7)};}

function goDay(w,d){const t=todayIdx();
 /* ROUND as well as clamp: goDay(1.5) otherwise survives the clamp and
    indexes week tables with a fractional key. */
 w=Math.round(Number(w)); if(!isFinite(w))w=1;
 d=Math.round(Number(d)); if(!isFinite(d))d=0;
 w=Math.max(1,Math.min(WEEKS,w));d=Math.max(0,Math.min(6,d));

 el.innerHTML=`<div class="card"><div class="eyebrow">Your hardest meal</div>
 <h2>The teacher lunch system</h2>
 <div class="info"><p>You snack through lunch because you are teaching, not because you are not hungry. So this is not about willpower, it is about having five things that need <span class="gold">no cooking, no prep and no decision.</span></p></div>
 ${S.lunch.length?S.lunch.map((l,i)=>`<div class="row">
  <div class="rb"><div class="rn">${i+1}. ${esc(l.n||'Combination '+(i+1))}</div>
  <div class="rm">${esc(l.d||'')}</div></div>
  <button class="act" onclick="delLunch(${i})">Remove</button></div>`).join('')
 :`<div class="flag"><p>Nothing here yet. <span class="gold">Build five combinations from food you already eat and know you are fine with.</span></p>
   <p>Each one needs a protein, a carb, and something you actually want to eat. Then you rotate them and never think about lunch again.</p></div>`}
 <button class="btn alt" style="margin-top:11px" onclick="addLunch()">+ Add a lunch combination</button></div>`;}
function addLunch(){
 const opts=(cat)=>S.safe[cat].length
  ? S.safe[cat].map(f=>`<option value="${esc(f)}">${esc(f)}</option>`).join('')
  : '<option value="">nothing on your list yet</option>';
 openModal(`<h3>Build a lunch</h3>
 <p class="ms">Pick from your own food list. A protein, a carb, and something you actually want.</p>
 <div class="form"><label>Name it</label><input id="ln" placeholder="e.g. Wrap day">
 <label>Protein</label><select id="lp">${opts('protein')}</select>
 <label>Carb</label><select id="lc">${opts('carb')}</select>
 <label>Plus</label><select id="ls">${opts('snack')}</select>
 <button class="btn" style="margin-top:14px" onclick="saveLunch()">Save</button></div>
 ${S.safe.protein.length?'':'<div class="flag" style="margin-top:12px"><p>Add a few things to your food list first and they will show up here.</p></div>'}`);}
function saveLunch(){const n=document.getElementById('ln').value.trim();
 const parts=['lp','lc','ls'].map(id=>{const el=document.getElementById(id);return el?el.value:'';}).filter(Boolean);
 const d=parts.join(', ');
 if(n||d)S.lunch.push({n:n||('Lunch '+(S.lunch.length+1)),d});
 save();closeModal();render();}
function delLunch(i){S.lunch.splice(i,1);save();render();}


/* the hints deliberately name NO foods now that his own list is in. Listing
   examples was useful when the categories were empty and is a suggestion once
   they are not, which is exactly what his file says never to do. */
const CATS=[['protein','Proteins','Anything you get your protein from'],
 ['carb','Carbs','Anything you get your carbs from'],
 ['snack','Snacks','What you actually reach for'],
 ['dinner','Dinners','Meals you already eat or would happily eat again'],
 ['drink','Drinks','Including the Red Bull Zero. It goes on the list, not in the bin']];

/* FUEL ON THE HARD DAYS. Mon, Wed and Fri are the lifts and Saturday is the long
   run. He is home at 5:45 and trains at 8:30, so dinner IS the pre-training meal
   and the job after training is protein, not another meal. Every item named here
   comes off his own list. Nothing is left as a choice, because an unnamed slot
   reads as broken to someone who is already anxious about food. */
const FUEL={
 0:{t:'Full Body A',    d:'Grilled chicken with rice',      pre:'A banana about an hour before you lift', post:'Yogurt, or a protein bar if it is late'},
 2:{t:'Full Body B',    d:'Pasta, a big plate of it',        pre:'Rice cakes about an hour before you lift', post:'Cottage cheese'},
 4:{t:'Full Body C',    d:'Tacos, load the tortillas up',    pre:'A banana about an hour before you lift', post:'Yogurt'},
 5:{t:'Long run day',   d:'Chicken cutlets with potatoes',   pre:'A bagel before you head out, not after', post:'Chicken and rice, or last night\u2019s leftovers'}
};
function pushCard(){const el=document.getElementById('pushCard'); if(!el)return;
 const f=FUEL[VD];
 if(!f){el.innerHTML=`<div class="card"><div class="eyebrow">Fuel</div>
   <h2>Today is an easy day</h2>
   <div class="info"><p>Nothing extra to hit. <span class="gold">Three eating occasions and your protein</span>, same as any other day.</p>
   <p>The bigger days are Monday, Wednesday, Friday and Saturday. Those are the ones with a plan attached.</p></div></div>`;return;}
 el.innerHTML=`<div class="card" style="border-color:rgba(138,111,52,.45);background:linear-gradient(140deg,#FFFBF2,var(--panel))">
  <div class="eyebrow">Fuel &middot; ${f.t}</div>
  <h2>Today is one of the days you push</h2>
  <div class="info"><p>You are home at 5:45 and lifting at 8:30, so <span class="gold">dinner is your pre-training meal.</span> It is not a separate thing to remember.</p></div>
  <div class="row"><div class="rb"><div class="rn">Dinner, around 6:30</div><div class="rm">${esc(f.d)}</div></div></div>
  <div class="row"><div class="rb"><div class="rn">Before you train</div><div class="rm">${esc(f.pre)}</div></div></div>
  <div class="row"><div class="rb"><div class="rn">After</div><div class="rm">${esc(f.post)}</div></div></div>
  <div class="info"><p>Every one of those is off your own list. <span class="gold">Nothing new, nothing you have to try.</span></p>
  <p>If one of them is not in the house, swap it for anything else on your list rather than skipping it. Under-eating on a lifting day costs you the session, not the week.</p></div>
  <div class="flag"><p>The Red Bull Zero before you train is fine and it is staying. <span class="gold">Just log it</span>, because caffeine at 8pm is worth watching against your bedtime, not banning.</p></div>
  </div>`;}
function foodCard(){const el=document.getElementById('foodCard');
 const total=CATS.reduce((a,c)=>a+S.safe[c[0]].length,0);
 el.innerHTML=`<div class="card"><div class="eyebrow">Do this before week 1</div>
 <h2>Your food list</h2>
 <div class="info"><p>This is the only setup job in the app, and everything else is built from it. <span class="gold">List the food you already eat and are comfortable with.</span></p>
 <p>Nothing gets added to this list that you have not put there yourself. No new foods, no swaps, no "have you tried". <span class="gold">We work with what you eat.</span></p></div>
 ${CATS.map(c=>`<div style="margin-top:14px">
  <div class="ft">${c[1]} <span style="color:var(--mut2);font-weight:400;text-transform:none;letter-spacing:0"> ${S.safe[c[0]].length}</span></div>
  <div class="rm" style="margin-bottom:7px">${c[2]}</div>
  ${S.safe[c[0]].length?S.safe[c[0]].map((f,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px">
   <span>${esc(f)}</span><button class="act" onclick="delFood('${c[0]}',${i})">\u2715</button></div>`).join('')
   :'<div class="rm" style="color:var(--mut2)">Nothing added yet</div>'}
  <button class="act" style="margin-top:7px" onclick="addFood('${c[0]}','${c[1]}')">+ Add</button>

 ${total<5?`<div class="flag" style="margin-top:14px"><p><span class="gold">Get at least a few into each list before Monday.</span> Your lunches and your shopping list both come straight out of this.</p></div>`:''}

function addFood(cat,lab){openModal(`<h3>Add to ${esc(lab)}</h3>
 <p class="ms">Only things you already eat and are fine with.</p>
 <div class="form"><input id="fIn" placeholder="e.g. whatever you actually buy">
 <button class="btn" style="margin-top:12px" onclick="saveFood('${cat}')">Add</button></div>`);
 setTimeout(()=>{const i=document.getElementById('fIn');if(i)i.focus();},60);}
function saveFood(cat){const v=document.getElementById('fIn').value.trim();
 if(v)S.safe[cat].push(v);save();closeModal();render();}
function delFood(cat,i){S.safe[cat].splice(i,1);save();render();}

function groceryCard(){const el=document.getElementById('groceryCard');
 const all=CATS.map(c=>[c[1],S.safe[c[0]],c[0]]).filter(x=>x[1].length);
 el.innerHTML=`<div class="card"><div class="eyebrow">One shop, one week</div>
 <h2>Grocery list</h2>
 ${all.length?`<p class="sub">Straight from your food list. Tick what you need this week.</p>
 ${all.map(g=>`<div style="margin-top:13px"><div class="ft">${g[0]}</div>
  ${g[1].map(f=>{const k=buyKey(g[2],f);
   return `<div style="display:flex;gap:9px;align-items:center;padding:5px 0;font-size:13.5px;cursor:pointer" onclick="togBuy('${g[2]}',${JSON.stringify(f).replace(/"/g,'&quot;')})">
   <span style="color:${S.bought[k]?'var(--gold)':'var(--mut2)'}">${S.bought[k]?'\u2713':'\u25A1'}</span>${esc(f)}</div>`;}).join('')}
  </div>`).join('')}
 <div class="flag" style="margin-top:14px"><div class="ft">The rule that makes this work</div>
 <p>If it is not in the house, you will order something. <span class="gold">That is the whole reason lunch keeps failing.</span></p>
 <p>One shop on Sunday and the week mostly runs itself.</p></div>`
 :`<div class="flag"><p>Fill in your food list above and your shopping list builds itself from it.</p></div>`}
 </div>`;}
/* one key function for both render and click. the old version stripped apostrophes
   on click but not on render, so ticking anything with one silently did nothing. */
function buyKey(cat,food){return cat+'||'+String(food);}
function togBuy(cat,food){const k=buyKey(cat,food);
 if(S.bought[k])delete S.bought[k];else S.bought[k]=true;save();render();}

 const L=[

  ['Week 2 \u00b7 Microwave and ready-made','Microwave rice, pre-cooked chicken, anything that comes ready. Heat and eat, still no real cooking.'],

 ];

 ${L.map((x,i)=>`<div class="row">
  <div class="rb"><div class="rn" style="color:${i===step?'var(--txt)':'var(--mut)'}">${i===step?'\u25B6 ':''}${x[0]}</div>

 </div>`;}

function sleepCard(){const el=document.getElementById('sleepCard');const st=ds(VW,VD);
 const target=Math.min(7,5.5+VW*0.25);
 /* 15 min earlier each week from midnight, floored at 10:30pm which gives
    7h15 in bed against his fixed 5:45 wake. */
 const tgtTime=(()=>{
  const mins=Math.min(90,(VW-1)*15);          // minutes earlier than midnight
  const total=(24*60)-mins;                    // minutes from 00:00
  let h=Math.floor(total/60)%24, m=total%60;
  if(h===0&&m===0)return '12:00 midnight';
  const ampm=h>=12?'pm':'am';
  let h12=h%12; if(h12===0)h12=12;
  return h12+':'+String(m).padStart(2,'0')+' '+ampm;})();
 el.innerHTML=`<div class="card"><div class="eyebrow">The biggest lever you have</div>
 <h2>Sleep</h2>
 <div class="info"><p>You are getting about <span class="gold">5.5 hours</span> and you are up at 5:45 whether you like it or not. The wake time is fixed, so bedtime is the only thing we can move.</p>
 <p>Fifteen minutes earlier a week. That is it. <span class="gold">This week: lights out by ${tgtTime}.</span></p></div>
 <div class="grid2">
  <button class="met" onclick="editT('bed','Bedtime')"><b class="${st.t.bed==null?'empty':''}">${st.t.bed!=null?esc(st.t.bed):'\u00b7'}</b><i>lights out</i></button>
  <button class="met" onclick="editT('slept','Slept','hrs')"><b class="${st.t.slept==null?'empty':''}">${st.t.slept!=null?esc(st.t.slept):'\u00b7'}</b><i>hours</i></button></div>
 <div class="flag"><div class="ft">Win the hour before bed</div>
 <p>Finish caffeine earlier. Get your school things ready before you sit down, not after. Same shutdown every night. Phone out of reach if it is what keeps you up.</p></div>
 <div class="flag"><div class="ft">Your 9pm pre-workout</div>
 <p>You train at 8:30 or 9 and you struggle to fall asleep. Those two facts are probably related.</p>
 <p>I am not banning it. <span class="gold">Try two weeks without it on the late sessions and look at your own numbers.</span> If nothing changes, keep it.</p></div></div>`;}

function plateauCard(){const el=document.getElementById('plateauCard');
 if(VW<4){el.innerHTML='';return;}
 el.innerHTML=`<div class="card"><div class="eyebrow">Read this before you get annoyed</div>
 <h2>A plateau is data, not failure</h2>
 <div class="info"><p>You told me plateaus are where you lose motivation. So here is what happens instead of panicking.</p>
 <p><span class="gold">Nothing changes on the back of two flat weigh-ins.</span> A stall under three weeks is noise: water, food timing, salt, a heavier training week.</p></div>
 <div class="flag"><div class="ft">If it is genuinely flat for 3 to 4 weeks</div>
 <p>We check adherence, then intake consistency, then training, then sleep, then activity. <span class="gold">Then we make the smallest change that could work.</span> Usually one thing, never four.</p>

function eduCard(){const el=document.getElementById('eduCard');
 el.innerHTML=`<div class="card"><div class="eyebrow">Why it is built this way</div>
 <h2>The reasoning</h2>
 <div class="info"><div class="ft">Why machines, not barbells</div>
 <p>You have never lifted and you said you worry about people watching. A machine holds the path for you, so there is no setup, no balance, and nothing to get visibly wrong.</p>
 <p>Free weights come later once you are not thinking about the room.</p></div>
 <div class="info"><div class="ft">Why the running had to come down</div>
 <p>Seven identical days was giving you the aerobic benefit of about four and the knee irritation of seven.</p>
 <p>There is also good news: the research on running plus lifting says the interference mostly shows up in people who are already <span class="gold">trained lifters.</span> You are not one yet, so you can do both without the running blunting your strength.</p></div>
 <div class="info"><div class="ft">Why 5 to 7 exercises and not 15</div>
 <p>Because you will do 5 to 7 at 9pm after teaching all day. You will not do 15, and a session you skip is worth nothing.</p></div>
 <div class="info"><div class="ft">Why no deficit yet</div>

function render(){
 syncToday();
 const p=document.getElementById('cdPill');
 p.className='rdy n';p.textContent='WEEK '+VW+' / 12';
 [installCard,countCard,dayStrip,sessionCard,pushCard,fuelCard,foodCard,lunchCard,groceryCard,cookCard,sleepCard,
  checkinCard,minCard,plateauCard,eduCard].forEach(fn=>{
   try{fn();}catch(e){console.error('card failed:',fn.name,e);}});
}
render();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&syncToday())render();});
