<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAF7F2">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>ELVT COACH, Kelsey</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF7F2;--panel:#FFFFFF;--panel2:#F4F0E9;--line:#E4DFD6;
--gold:#8A6F34;--gold-dim:#A58A4E;--gold-soft:rgba(138,111,52,.09);
--txt:#111111;--mut:#6E6A64;--mut2:#9A958D;--ok:#2F7D4F;--warn:#A8641F;--bad:#A33F36;--r:12px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);
 font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
 font-size:15px;line-height:1.5;padding-bottom:40px}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
.top{position:sticky;top:0;z-index:50;background:rgba(250,247,242,.94);
 backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:11px 0;margin-bottom:14px}
.topin{max-width:560px;margin:0 auto;padding:0 14px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:9px}
.brand img{height:15px;width:auto;display:block}
.brand small{font-size:9px;letter-spacing:.2em;color:var(--mut);font-weight:600;text-transform:uppercase}
.streak{font-size:10px;letter-spacing:.14em;color:var(--mut);border:1px solid var(--line);
 border-radius:999px;padding:5px 12px;font-weight:600;text-transform:uppercase}
.streak b{color:var(--gold);font-size:12px;margin-left:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
 padding:18px;margin-bottom:13px}
.eyebrow{font-size:9.5px;letter-spacing:.2em;font-weight:700;color:var(--gold);
 text-transform:uppercase;margin-bottom:7px}
h2{font-family:'Cormorant Garamond',serif;font-size:25px;font-weight:600;margin:0 0 4px;line-height:1.15}
.sub{font-size:12.5px;color:var(--mut);margin:0}
.info,.flag{background:var(--panel2);border-radius:9px;padding:14px 16px;margin:12px 0}
.flag{background:#FFFBF2;border-left:3px solid var(--gold)}
.ft{font-size:10px;letter-spacing:.14em;font-weight:700;color:var(--gold);
 text-transform:uppercase;margin-bottom:7px}
.info p,.flag p{margin:0 0 7px;font-size:13px;color:#3A3833;line-height:1.6}
.info p:last-child,.flag p:last-child{margin-bottom:0}
.gold{color:var(--gold);font-weight:600}
.row{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.rb{flex:1;min-width:0}
.rn{font-size:14.5px;font-weight:600;line-height:1.3}
.rm{font-size:11.5px;color:var(--mut);margin-top:3px;line-height:1.45}
.tick{width:26px;height:26px;border:1.5px solid var(--line);border-radius:7px;flex:0 0 auto;
 background:transparent;cursor:pointer;position:relative;margin-top:1px;transition:.15s}
.tick.on{background:var(--gold);border-color:var(--gold)}
.tick.on:after{content:'';position:absolute;left:8px;top:4px;width:6px;height:11px;
 border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}
.stat{background:var(--panel2);border-radius:9px;padding:13px 8px;text-align:center}
.stat b{display:block;font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--gold);line-height:1}
.stat i{display:block;font-style:normal;font-size:9px;letter-spacing:.12em;
 color:var(--mut);text-transform:uppercase;margin-top:5px}
.bar{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:9px 0}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:.3s}
.btn{display:block;width:100%;padding:14px;border-radius:9px;border:none;background:var(--gold);
 color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.alt{background:transparent;border:1.5px solid var(--line);color:var(--txt)}
.act{font-size:11px;padding:6px 11px;border-radius:7px;border:1px solid var(--line);
 background:transparent;color:var(--mut);cursor:pointer;font-family:inherit;font-weight:600}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.allergy{background:#FFF4F2;border:1px solid #E8C9C4;border-radius:9px;padding:12px 14px;margin:12px 0}
.allergy .ft{color:var(--bad)}
.allergy p{font-size:12.5px;color:#5A3A36;margin:0;line-height:1.55}
.mask{position:fixed;inset:0;background:rgba(17,17,17,.42);backdrop-filter:blur(3px);
 z-index:100;display:none;align-items:flex-end;justify-content:center}
.mask.on{display:flex}
.sheet{background:var(--panel);border-radius:16px 16px 0 0;padding:22px 18px 30px;
 width:100%;max-width:560px;max-height:88vh;overflow-y:auto}
.sheet h3{font-family:'Cormorant Garamond',serif;font-size:22px;margin:0 0 6px;font-weight:600}
.ms{font-size:12.5px;color:var(--mut);margin:0 0 14px;line-height:1.55}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;
 padding:13px 14px;border:1px solid var(--line);border-radius:9px;background:transparent;
 margin-bottom:7px;cursor:pointer;font-family:inherit;font-size:13.5px;text-align:left;color:var(--txt)}
.opt.cur{border-color:var(--gold);background:var(--gold-soft)}
.opt small{color:var(--mut);font-size:11.5px}
.form label{display:block;font-size:11px;letter-spacing:.1em;color:var(--mut);
 text-transform:uppercase;font-weight:700;margin-bottom:5px}
.form input,.form textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;
 background:var(--bg);color:var(--txt);font-size:15px;font-family:inherit;margin-bottom:11px}
.pill{display:inline-block;font-size:9.5px;letter-spacing:.1em;padding:3px 8px;border-radius:99px;
 border:1px solid var(--line);color:var(--mut);text-transform:uppercase;font-weight:700}
.more{margin-top:12px}
.more summary{font-size:11px;letter-spacing:.14em;font-weight:700;color:var(--gold);
 text-transform:uppercase;cursor:pointer;list-style:none}
.more summary::-webkit-details-marker{display:none}
.more summary:after{content:'  +'}
.more[open] summary:after{content:'  \2212'}
.glist{margin-top:10px}
.gcat{font-size:10px;letter-spacing:.14em;font-weight:700;color:var(--gold);
 text-transform:uppercase;margin:13px 0 6px}
.gitem{display:flex;gap:9px;align-items:flex-start;padding:5px 0;font-size:13px}
.gitem span{color:var(--mut2);flex:0 0 auto}
.scale{display:flex;gap:6px;margin:8px 0 0}
.sc{flex:1;padding:9px 0;border:1px solid var(--line);border-radius:8px;background:transparent;
 font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--txt)}
.sc.on{background:var(--gold);border-color:var(--gold);color:#fff}
.qlab{font-size:12.5px;font-weight:600;margin:14px 0 0}
</style></head><body>

<script>
'use strict';
const KEY='elvt_kelsey_v1';
const START=new Date(2026,8,14);          // Mon 14 Sep 2026, week 1
const WEEKS=26;                            // 6 months

/* ---------- her numbers. week 1 is BASELINE, no deficit ---------- */
const PHASES=[
 {n:'BASELINE',   w:[1,2],   kcal:2400, note:'No deficit. We find out what your body actually does.'},
 {n:'FAT LOSS 1', w:[3,12],  kcal:null, note:'Set from your real data, not a calculator.'},
 {n:'MAINTENANCE',w:[13,14], kcal:null, note:'A planned break. Earned, not a failure.'},
 {n:'FAT LOSS 2', w:[15,24], kcal:null, note:'Second block.'},
 {n:'EXIT',       w:[25,26], kcal:null, note:'Keeping it, without me.'}
];
const PROTEIN=130, FAT=80;
const STEP_GOAL=10000, WATER_GOAL=2500;   // ml, deliberately modest to start
const START_LBS=238, GOAL_LOSS=100;

/* ---------- ALLERGENS. hard exclusions, checked before anything displays ---------- */
const ALLERGENS=['peanut','tree nut','pine nut','almond','coconut','seafood','shellfish',
 'prawn','shrimp','crab','lobster','oyster','mussel','scallop','squid','calamari','anchov','fish','salmon','tuna','cod','tilapia',
 'cashew','walnut','pecan','pistachio','hazelnut','macadamia','brazil nut','praline','marzipan',
 'nutella','nut butter','trail mix','pesto','satay','pad thai','granola'];
/* bare "nut"/"nuts" needs a word boundary so it blocks "mixed nuts" without
   tripping on "nutrition", "nutmeg" or "donut". */
const ALLERGEN_RE=/\bnuts?\b/i;
function safe(txt){const t=String(txt).toLowerCase();
  if(ALLERGEN_RE.test(t))return false;
  return !ALLERGENS.some(a=>t.includes(a));}

/* ---------- meals, built only from foods she named ---------- */
const MEALS=[
 {n:'Meal 1 \u00b7 morning', m:[520,32,62,15], items:[
   ['Eggs, scrambled','3'],['Toast or bagel','2 slices'],['Greek yogurt','150g']]},
 {n:'Coffee', m:[210,8,24,9], items:[
   ['Your usual coffee','1'],['Counted, not cut',', ']]},
 {n:'Meal 2 \u00b7 work', m:[640,42,78,16], items:[
   ['Chicken breast','170g cooked'],['White rice','200g cooked'],['Veg you actually like','handful']]},
 {n:'Meal 3 \u00b7 evening', m:[780,48,96,22], items:[
   ['Golden curry with chicken','1 portion'],['White rice','250g cooked'],
   ['or quesadilla + chicken','alternative']]},
 {n:'Planned sweet thing', m:[250,4,38,10], items:[
   ['Whatever you actually want','1'],['In the numbers, not banned',', ']]}
];

/* ---------- grocery, generated from the meals ---------- */

const D={v:1,d:{},w:{},whoop:{},ci:{},gr:{},install:0};
function load(){
  const s=JSON.parse(JSON.stringify(D));
  try{const x=JSON.parse(localStorage.getItem(KEY)||'{}');
    if(x&&typeof x==='object'&&!Array.isArray(x))Object.assign(s,x);
  }catch(e){}
  /* a saved null must not survive: Object.assign happily copies it over the default
     and every dstate() call downstream then throws. */
  ['d','w','whoop','ci','gr'].forEach(k=>{
    if(!s[k]||typeof s[k]!=='object'||Array.isArray(s[k]))s[k]={};});
  return s;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let S=load();

const key=(w,d)=>w+'-'+d;
function dstate(w,d){const k=key(w,d);
  let r=S.d[k];
  if(!r||typeof r!=='object'||Array.isArray(r)){r=S.d[k]={t:{},meals:{},water:0,steps:null};return r;}
  /* harden the sub-objects too. meals coming back null made nutritionCard throw,
     and because render() catches per card the card just disappeared. */
  ['t','meals'].forEach(f=>{const v=r[f];
    if(!v||typeof v!=='object'||Array.isArray(v))r[f]={};});
  if(typeof r.water!=='number'||!isFinite(r.water))r.water=0;
  if(r.steps!=null&&(typeof r.steps!=='number'||!isFinite(r.steps)))r.steps=null;
  return r;}
function dateOf(w,d){const x=new Date(START);x.setDate(x.getDate()+(w-1)*7+d);return x;}
/* DAY DIFFERENCE, DST SAFE. Two local midnights are 23 or 25 hours apart across
   a daylight saving change, so dividing milliseconds and flooring can lose a day.
   Comparing the calendar dates as UTC takes the clock out of it entirely. */
function dayDiff(a,b){
  const A=Date.UTC(a.getFullYear(),a.getMonth(),a.getDate());
  const B=Date.UTC(b.getFullYear(),b.getMonth(),b.getDate());
  return Math.round((A-B)/86400000);}
function todayIdx(){const n=new Date();n.setHours(0,0,0,0);
  const s=new Date(START);s.setHours(0,0,0,0);
  const diff=dayDiff(n,s);
  if(diff<0)return{w:1,d:0};
  return{w:Math.min(WEEKS,Math.floor(diff/7)+1),d:diff%7};}
let VW, VD, PINNED=false;
(function(){const t=todayIdx();VW=t.w;VD=t.d;})();
/* If she leaves the app open on her home screen the clock moves but the view would not.
   Recompute before every render unless she has deliberately tapped another day. */
function syncToday(){if(PINNED)return false;
  const t=todayIdx();
  if(t.w!==VW||t.d!==VD){VW=t.w;VD=t.d;return true;}
  return false;}
function goDay(w,d){const t=todayIdx();
  /* clamp so a stray call can never create a phantom day record outside the program */
  w=Math.round(Number(w)); if(!isFinite(w))w=1;
  d=Math.round(Number(d)); if(!isFinite(d))d=0;
  w=Math.max(1,Math.min(WEEKS,w));
  d=Math.max(0,Math.min(6,d));
  VW=w;VD=d;PINNED=!(w===t.w&&d===t.d);save();render();}
function goToday(){const t=todayIdx();VW=t.w;VD=t.d;PINNED=false;render();}
function phaseOf(w){return PHASES.find(p=>w>=p.w[0]&&w<=p.w[1])||PHASES[0];}
function kcalFor(w){const p=phaseOf(w);return p.kcal||2400;}

 ${M.map(m=>`<div class="gitem"><span>${m[1]()?'\u2713':'\u25A1'}</span>${m[0]}</div>`).join('')}</div>
 <button class="btn alt" style="margin-top:14px" onclick="logWeight()">Log this week's weight</button>
 <button class="btn alt" style="margin-top:8px" onclick="markSizeDown()">${S.gr.sizeDown?'\u2713 Clothing size down':'Mark a clothing size down'}</button>
 <div class="rm" style="margin-top:9px">Once a week, same morning, same conditions. Not daily.</div></div>`;}
function lastWeight(){const ks=Object.keys(S.w).map(Number).sort((a,b)=>a-b);
  return ks.length?S.w[ks[ks.length-1]]:null;}
function weeksLogged(){return Object.keys(S.w).length;}
/* real counts, not placeholders */
function daysLogged(){return Object.values(S.d).filter(d=>d&&d.t&&Object.values(d.t).some(Boolean)).length;}
function stepDays(){return Object.values(S.d).filter(d=>d&&d.t&&d.t.steps).length;}
function fullWeeks(){const byWeek={};
  Object.keys(S.d).forEach(k=>{const w=k.split('-')[0],d=S.d[k];
    if(d&&d.t&&Object.keys(d.t).filter(x=>d.t[x]).length>=7){byWeek[w]=(byWeek[w]||0)+1;}});
  return Object.values(byWeek).filter(n=>n>=7).length;}
function markSizeDown(){S.gr.sizeDown=!S.gr.sizeDown;save();render();
  toast(S.gr.sizeDown?'Logged. That is the one that counts.':'Unmarked');}
function logWeight(){openModal(`<h3>Weight, week ${VW}</h3>
 <p class="ms">Morning, after the bathroom, before food. Same every week.</p>
 <div class="form"><label>Weight, lbs</label>
 <input id="wIn" type="number" inputmode="decimal" step="0.1" value="${S.w[VW]||''}" placeholder="e.g. 236.4">
 <button class="btn" onclick="saveWeight()">Save</button></div>
 <div class="info"><p>If it goes up one week, that is water, food timing or your cycle. <span class="gold">It is not fat and it is not failure.</span> We read the trend, not the day.</p></div>`);}
function saveWeight(){const v=parseFloat(document.getElementById('wIn').value);
 if(!isNaN(v))S.w[VW]=v;save();closeModal();render();toast('Logged');}

function eduCard(){const el=document.getElementById('eduCard');
 el.innerHTML=`<div class="card">
 <div class="eyebrow">Why we are doing it this way</div>
 <h2>The short version</h2>
 <div class="info"><div class="ft">Maintenance is not a calculator number</div>
 <p>Any app can tell you a number. It is an estimate. We confirm yours using what you actually eat and what your weight actually does over a week. <span class="gold">Then every number after that is real.</span></p></div>
 <div class="info"><div class="ft">Why protein, specifically</div>
 <p>Two reasons. It keeps you full, which is your evening problem. And it is what stops you losing muscle alongside fat while you are in a deficit.</p>
 <p>It only works alongside lifting. That is why both are in the plan.</p></div>
 <div class="info"><div class="ft">Why the training starts small</div>
 <p>You said you could train five or six days. You probably could. You also said one rest day turns into several and that training is the first thing to go.</p>
 <p><span class="gold">Two sessions you never miss beats five you abandon in March.</span></p></div>
 <div class="info"><div class="ft">Why we are not rushing</div>
 <p>100 lb is the destination. There is no weekly amount you have to hit, and there never will be.</p>
 <p>Everything that has stopped you before started with one bad week becoming one bad month. That is the thing we are actually solving.</p></div></div>`;}

/* ---------- render ---------- */
function render(){
 syncToday();
 document.getElementById('stk').textContent=weeksLogged();
 [installCard,phaseCard,weekCard,dayStrip,todayCard,nutritionCard,groceryCard,whoopCard,
  checkinCard,minCard,progressCard,eduCard].forEach(fn=>{
   try{fn();}catch(e){console.error('card failed:',fn.name,e);}});
}
render();
/* a phone keeps this app alive for days. catch the date change three ways. */
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&syncToday())render();});
window.addEventListener('focus',()=>{if(syncToday())render();});
setInterval(()=>{if(syncToday())render();},60000);
</script></body></html>
