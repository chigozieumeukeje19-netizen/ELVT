<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>ELVT COACH, Stephanie</title>
<style>
:root{--bg:#FAF7F2;--panel:#FFFFFF;--panel2:#F4F0E9;--line:#E4DFD6;
--gold:#8A6F34;--gold-dim:#A58A4E;--gold-soft:rgba(138,111,52,.09);
--txt:#111111;--mut:#6E6A64;--mut2:#9A958D;--ok:#2F7D4F;--warn:#A8641F;--bad:#A33F36;--r:12px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font-size:15px;line-height:1.5;padding-bottom:40px;
 font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
.top{position:sticky;top:0;z-index:50;background:rgba(250,247,242,.94);backdrop-filter:blur(8px);
 border-bottom:1px solid var(--line);padding:11px 0;margin-bottom:14px}
.topin{max-width:560px;margin:0 auto;padding:0 14px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:9px}
.brand img{height:15px;width:auto;display:block}
.brand small{font-size:9px;letter-spacing:.2em;color:var(--mut);font-weight:600;text-transform:uppercase}
.rdy{font-size:9px;letter-spacing:.14em;border-radius:999px;padding:5px 12px;font-weight:700;text-transform:uppercase}
.rdy.g{background:rgba(47,125,79,.12);color:var(--ok)}
.rdy.y{background:rgba(168,100,31,.13);color:var(--warn)}
.rdy.r{background:rgba(163,63,54,.12);color:var(--bad)}
.rdy.n{background:var(--panel2);color:var(--mut)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:13px}
.eyebrow{font-size:9.5px;letter-spacing:.2em;font-weight:700;color:var(--gold);text-transform:uppercase;margin-bottom:7px}
h2{font-family:Georgia,'Times New Roman',serif;font-size:24px;font-weight:600;margin:0 0 4px;line-height:1.15}
.sub{font-size:12.5px;color:var(--mut);margin:0}
.info,.flag{background:var(--panel2);border-radius:9px;padding:14px 16px;margin:12px 0}
.flag{background:#FFFBF2;border-left:3px solid var(--gold)}
.ft{font-size:10px;letter-spacing:.14em;font-weight:700;color:var(--gold);text-transform:uppercase;margin-bottom:7px}
.info p,.flag p{margin:0 0 7px;font-size:13px;color:#3A3833;line-height:1.6}
.info p:last-child,.flag p:last-child{margin-bottom:0}
.gold{color:var(--gold);font-weight:600}
.row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.rb{flex:1;min-width:0}.rn{font-size:14.5px;font-weight:600;line-height:1.3}
.rm{font-size:11.5px;color:var(--mut);margin-top:3px;line-height:1.45}
.tick{width:26px;height:26px;border:1.5px solid var(--line);border-radius:7px;flex:0 0 auto;
 background:transparent;cursor:pointer;position:relative;margin-top:1px}
.tick.on{background:var(--gold);border-color:var(--gold)}
.tick.on:after{content:'';position:absolute;left:8px;top:4px;width:6px;height:11px;
 border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.met{background:var(--panel2);border-radius:9px;padding:11px 9px;text-align:center;border:none;
 cursor:pointer;font-family:inherit;width:100%}
.met b{display:block;font-family:Georgia,serif;font-size:19px;color:var(--txt);line-height:1}
.met b.empty{color:var(--mut2);font-size:15px}
.met i{display:block;font-style:normal;font-size:8.5px;letter-spacing:.1em;color:var(--mut);
 text-transform:uppercase;margin-top:5px}
.met .dl{font-size:9px;color:var(--gold);margin-top:3px;font-weight:700}
.bar{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:9px 0}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.btn{display:block;width:100%;padding:14px;border-radius:9px;border:none;background:var(--gold);
 color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.alt{background:transparent;border:1.5px solid var(--line);color:var(--txt)}
.act{font-size:11px;padding:6px 11px;border-radius:7px;border:1px solid var(--line);
 background:transparent;color:var(--mut);cursor:pointer;font-family:inherit;font-weight:600}
.scale{display:flex;gap:4px;margin:7px 0 0}
.sc{flex:1;padding:9px 0;border:1px solid var(--line);border-radius:7px;background:transparent;
 font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--txt)}
.sc.on{background:var(--gold);border-color:var(--gold);color:#fff}
.qlab{font-size:12px;font-weight:600;margin:13px 0 0;color:var(--txt)}
.mask{position:fixed;inset:0;background:rgba(17,17,17,.42);backdrop-filter:blur(3px);z-index:100;
 display:none;align-items:flex-end;justify-content:center}
.mask.on{display:flex}
.sheet{background:var(--panel);border-radius:16px 16px 0 0;padding:22px 18px 30px;width:100%;
 max-width:560px;max-height:88vh;overflow-y:auto}
.sheet h3{font-family:Georgia,serif;font-size:21px;margin:0 0 6px;font-weight:600}
.ms{font-size:12.5px;color:var(--mut);margin:0 0 14px;line-height:1.55}
.form label{display:block;font-size:11px;letter-spacing:.1em;color:var(--mut);text-transform:uppercase;
 font-weight:700;margin:11px 0 5px}
.form input,.form select{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;
 background:var(--bg);color:var(--txt);font-size:15px;font-family:inherit}
.more{margin-top:12px}
.more summary{font-size:11px;letter-spacing:.14em;font-weight:700;color:var(--gold);
 text-transform:uppercase;cursor:pointer;list-style:none}
.more summary::-webkit-details-marker{display:none}
.more summary:after{content:'  +'}.more[open] summary:after{content:'  \2212'}
.trend{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.trend:last-child{border-bottom:none}
.trend span{color:var(--mut)}.trend b{font-weight:600}
.up{color:var(--ok)}.dn{color:var(--bad)}.flat{color:var(--mut)}
.pill{display:inline-block;font-size:9px;letter-spacing:.1em;padding:3px 8px;border-radius:99px;
 border:1px solid var(--line);color:var(--mut);text-transform:uppercase;font-weight:700}
</style></head><body>

<script>
'use strict';
const KEY='elvt_stephanie_v1';
const START=new Date(2026,8,14);
const WEEKS=16;
const KG=63.5;

/* =========================================================================
   THE SESSION LIBRARY
   Every session carries a duration and an effort target. Every strength day
   carries named exercises with sets, reps and RIR. Nothing is a bare title.
   Exercise selection respects what is on file: no lunges (knees), no fast
   high-rep deadlifting (back), nothing that loads the psoas hard, and
   chest-supported rowing rather than free bent-over rowing (neck).
   Her old numbers are the ceiling for month four, never the week 1 target.
   ========================================================================= */
const EX={
 tbdl   :{n:'Trap bar deadlift',      c:'Slow off the floor. Never fast, never for high reps. This is the AFT deadlift being built, not tested.'},
 rdl    :{n:'Dumbbell RDL',           c:'Hinge at the hip, soft knees, stop where the hamstrings run out. Back stays flat.'},
 hipthr :{n:'Hip thrust',             c:'Ribs down, squeeze at the top, no arching to get more range.'},
 goblet :{n:'Goblet squat',           c:'Only as deep as stays comfortable. Depth is not the point.'},
 legpr  :{n:'Leg press',              c:'Heels flat, no locking out. Knee-friendly way to load the quads.'},
 stepup :{n:'Low box step-up',        c:'Low box on purpose. This is the lunge substitute your knees will tolerate.'},
 hamcur :{n:'Lying hamstring curl',   c:'Slow on the way back. That half is the one that protects the hamstring.'},
 calf   :{n:'Calf raise',             c:'Full range, pause at the top. Healed toe fractures mean the calf and foot get loaded on purpose.'},
 pushup :{n:'Push-up',                c:'On the floor or on a bench, whichever keeps the form. This is the AFT push-up.'},
 hrp    :{n:'Hand-release push-up',   c:'Chest down, hands lift clear, back up. Sub-maximal sets all week beat one set to failure.'},
 dbbench:{n:'Dumbbell bench press',   c:'Shoulders back and down. Elbows stay under the wrists.'},
 ohp    :{n:'Half-kneeling press',    c:'Half-kneeling so the low back cannot arch into it. Ribs stay down.'},
 csrow  :{n:'Chest-supported row',    c:'Supported on purpose. Your neck does not need to hold a bent-over position.'},
 pulldn :{n:'Lat pulldown',           c:'Shoulders down first, then pull. No leaning back to move more weight.'},
 face   :{n:'Face pull',              c:'Light. This is for the neck and shoulders, not a strength lift.'},
 plank  :{n:'Front plank',            c:'Straight line, ribs down, breathe. Progressed by time, and it is an AFT event.'},
 sideplk:{n:'Side plank',             c:'Hips stacked and lifted. Both sides, equal time.'},
 deadbug:{n:'Dead bug',               c:'Low back stays flat on the floor. Slow beats many.'},
 pallof :{n:'Pallof press',           c:'Resist the rotation. Nothing moves except the arms.'},
 carry  :{n:'Farmer carry',           c:'Tall, ribs down, no leaning. Direct carryover to the sprint-drag-carry.'},
 sdc    :{n:'Sprint-drag-carry rehearsal',c:'Phase 3 onward only. Walk the transitions first. The transitions cost more time than the legs do.'}
};

/* sets by phase. reps and RIR are constant: RPE 6 to 7, three to four in reserve. */
function setsFor(w){return w<=4?2:(w<=12?3:2);}

const STR={
 A:{n:'Strength A',sub:'Hinge and push',mins:45,
    ex:[['tbdl','5'],['dbbench','8-10'],['goblet','8-10'],['ohp','8-10'],['plank','time'],['deadbug','8-10 each']]},
 B:{n:'Strength B',sub:'Pull and posterior chain',mins:45,
    ex:[['hipthr','8-10'],['csrow','10-12'],['pulldn','10-12'],['hamcur','10-12'],['sideplk','time'],['pallof','10 each']]},
 C:{n:'Strength C',sub:'Full body and carries',mins:40,
    ex:[['rdl','6-8'],['carry','40m'],['stepup','8 each'],['hrp','6-8'],['calf','12-15'],['plank','time']]},
 M:{n:'Strength maintenance',sub:'Hold what you built',mins:30,
    ex:[['tbdl','5'],['pushup','8-10'],['csrow','10-12'],['plank','time']]}
};

/* plank hold progression, seconds. an AFT event, so it is programmed not guessed. */
function plankSec(w){return Math.min(150,45+(w-1)*7);}

/* run/walk ladder, re-entry only. ratio and total, never a vague "run/walk". */
const RW={1:{r:1,w:2,x:6,tot:20},2:{r:1,w:2,x:7,tot:22},3:{r:2,w:2,x:6,tot:26},4:{r:2,w:2,x:5,tot:22}};
/* continuous easy running, base phase. */
const CONT={5:20,6:24,7:28,8:22};
/* quality sessions, build and performance. deload weeks get none. */
const QUAL={9:'4 x 3 min at RPE 6 to 7, 2 min easy between',
            10:'5 x 3 min at RPE 6 to 7, 2 min easy between',
            11:'3 x 6 min at RPE 6 to 7, 3 min easy between',
            12:null,
            13:'4 x 4 min at RPE 7, 3 min easy between',
            14:'2 x 8 min at RPE 7, 4 min easy between',
            15:'3 x 5 min at RPE 7, 3 min easy between',
            16:'Two-mile time trial. The benchmark, not a training session.'};
/* durations, explicit per week so deloads actually come down. */
const LONG={1:35,2:40,3:45,4:35, 5:50,6:55,7:60,8:45, 9:65,10:70,11:75,12:55, 13:70,14:75,15:60,16:45};
const EASY={1:30,2:30,3:35,4:30, 5:35,6:35,7:40,8:30, 9:40,10:40,11:45,12:35, 13:40,14:40,15:35,16:30};

const PHASES=[
 {n:'RE-ENTRY',    w:[1,4],  d:'Aerobic restoration. Establish the baseline before we load anything.'},
 {n:'BASE',        w:[5,8],  d:'Volume up. Continuous running returns. Strides introduced.'},
 {n:'BUILD',       w:[9,12], d:'Threshold work, long-run durability, AFT layer on top.'},
 {n:'PERFORMANCE', w:[13,16],d:'Two-mile ability, final benchmark, then you run it yourself.'}
];
function phaseOf(w){return PHASES.find(p=>w>=p.w[0]&&w<=p.w[1])||PHASES[0];}

const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

/* ---------- THE SCHEDULE. Single source of truth. ----------
   Every entry returns a full session: duration, effort target, and for
   strength days the exercise list. PLAN below is DERIVED from this, so the
   counts on the plan card can never drift from the days actually scheduled. */
function strSession(k,w){
 const T=STR[k], sets=setsFor(w);
 return {k:'str',t:T.n,sub:T.sub,mins:T.mins,
  effort:'RPE 6 to 7 \u00b7 three to four reps in reserve \u00b7 nothing to failure',
  ex:T.ex.map(([id,reps])=>({id,n:EX[id].n,c:EX[id].c,
    meta:reps==='time'?`${sets} sets \u00d7 ${plankSec(w)} sec`:`${sets} sets \u00d7 ${reps}`}))};
}
function sessionFor(w,d){
 const easyEffort='RPE 3 to 4 \u00b7 full sentences out loud \u00b7 if you cannot talk, slow down';
 if(w<=4){                                   /* RE-ENTRY */
  const rw=RW[w];
  switch(d){
   case 0:return {k:'aero',t:'Easy bike',mins:EASY[w],effort:easyEffort,
     detail:`${EASY[w]} minutes on the bike, steady. Low impact on purpose while the running restarts.`};
   case 1:return strSession('A',w);
   case 2:return {k:'aero',t:'Run/walk',mins:rw.tot,effort:easyEffort,
     detail:`5 min walk to start, then ${rw.x} rounds of ${rw.r} min easy run and ${rw.w} min walk, then walk home. ${rw.tot} min of work.`,
     rw:`${rw.r}:${rw.w} \u00d7 ${rw.x}`};
   case 3:return {k:'opt',t:'Optional easy swim, or nothing',mins:25,effort:'RPE 2 to 3 \u00b7 genuinely easy',
     detail:'Twenty to twenty five minutes in the pool, or take the day off completely. Both are correct answers. This day exists so the week has somewhere to give.'};
   case 4:return strSession('B',w);
   case 5:return {k:'long',t:'Long easy aerobic',mins:LONG[w],effort:easyEffort,
     detail:`${LONG[w]} minutes. Bike, walk, or a run/walk at the same ratio as Wednesday. Your choice of machine, not your choice of effort.`};
   default:return {k:'rest',t:'Full rest'};
  }
 }
 if(w<=8){                                   /* BASE */
  switch(d){
   case 0:return strSession('A',w);
   case 1:return {k:'aero',t:'Easy run',mins:CONT[w],effort:easyEffort,
     detail:`${CONT[w]} minutes continuous. First continuous running of the program. Duration is the only thing moving right now.`};
   case 2:return strSession('B',w);
   case 3:return {k:'aero',t:'Easy run + strides',mins:CONT[w],effort:easyEffort+' \u00b7 strides are relaxed, not sprints',
     detail:`${CONT[w]} min easy, then 4 \u00d7 20 sec strides with a full walk back between each. Strides are fast and loose, not hard.`};
   case 4:return strSession('C',w);
   case 5:return {k:'long',t:'Long easy run',mins:LONG[w],effort:easyEffort,
     detail:`${LONG[w]} minutes. Run/walk it if that keeps the effort honest. Finishing easy beats finishing fast.`};
   default:return {k:'rest',t:'Full rest'};
  }
 }
 if(w<=12){                                  /* BUILD */
  switch(d){
   case 0:return strSession('A',w);
   case 1:return {k:'aero',t:'Easy run',mins:EASY[w],effort:easyEffort,detail:`${EASY[w]} minutes easy. This one never becomes a hard day.`};
   case 2:return strSession('B',w);
   case 3:return QUAL[w]?{k:'aero',t:'Quality session',mins:EASY[w],hard:1,
     effort:'Work intervals RPE 6 to 7 \u00b7 comfortably hard \u00b7 a few words, not a sentence',
     detail:`10 min easy to warm up, then ${QUAL[w]}, then 10 min easy home.`}
     :{k:'aero',t:'Easy run',mins:EASY[w],effort:easyEffort,detail:`Deload week. No quality at all. ${EASY[w]} minutes strictly easy.`};
   case 4:return strSession(w>=9?'C':'C',w);
   case 5:return {k:'long',t:'Long easy run',mins:LONG[w],effort:easyEffort,detail:`${LONG[w]} minutes. The session that builds the two-mile, even though it looks nothing like it.`};
   default:return {k:'rest',t:'Full rest'};
  }
 }
 switch(d){                                  /* PERFORMANCE */
  case 0:return strSession('A',w);
  case 1:return {k:'aero',t:'Easy run',mins:EASY[w],effort:easyEffort,detail:`${EASY[w]} minutes easy.`};
  case 2:return {k:'rest',t:'Full rest'};
  case 3:return {k:'aero',t:w===16?'Two-mile benchmark':'Quality session',mins:EASY[w],hard:1,
    effort:w===16?'Test effort. Even pacing beats a fast first lap.':'Work intervals RPE 7 \u00b7 comfortably hard, controlled',
    detail:`10 min easy to warm up, then ${QUAL[w]}, then 10 min easy home.`};
  case 4:return strSession('M',w);
  case 5:return {k:'long',t:'Long easy run',mins:LONG[w],effort:easyEffort,detail:`${LONG[w]} minutes easy.`};
  default:return {k:'rest',t:'Full rest'};
 }
}

/* PLAN is derived from the schedule above, never hand written. */
const PLAN={};
(function(){
 const NOTE={1:'Run/walk only. Effort, not pace.',5:'Continuous easy running returns. Strides on run 2.',
             9:'One quality session. Everything else stays easy.',13:'Sharpening. Volume comes down, quality holds.'};
 for(let w=1;w<=16;w++){
  let str=0,aero=0,rest=0,opt=0;
  for(let d=0;d<7;d++){const k=sessionFor(w,d).k;
   if(k==='str')str++; else if(k==='aero'||k==='long')aero++; else if(k==='opt')opt++; else rest++;}
  PLAN[w]={str,aero,opt,rest,long:LONG[w],
    note:NOTE[w<=4?1:(w<=8?5:(w<=12?9:13))],deload:(w===4||w===8||w===12)};
 }
})();

const D={v:1,d:{},wk:{},install:0,aft:{}};
function load(){
 const s=JSON.parse(JSON.stringify(D));
 try{const x=JSON.parse(localStorage.getItem(KEY)||'{}');
  if(x&&typeof x==='object'&&!Array.isArray(x))Object.assign(s,x);}catch(e){}
 ['d','wk','aft'].forEach(k=>{if(!s[k]||typeof s[k]!=='object'||Array.isArray(s[k]))s[k]={};});
 return s;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let S=load();
const key=(w,d)=>w+'-'+d;
function ds(w,d){const k=key(w,d);
 let t=S.d[k];
 if(!t||typeof t!=='object'||Array.isArray(t)){t=S.d[k]={done:0,tr:{},rec:{},fu:{},ex:{}};return t;}
 ['tr','rec','fu','ex'].forEach(x=>{const v=t[x];
  if(!v||typeof v!=='object'||Array.isArray(v))t[x]={};});
 return t;}
function dateOf(w,d){const x=new Date(START);x.setDate(x.getDate()+(w-1)*7+d);return x;}
/* DAY DIFFERENCE, DST SAFE.
   Two local midnights are 23 or 25 hours apart across a daylight saving
   change, so dividing elapsed milliseconds by 86400000 and flooring it
   loses a whole day when the clocks go forward. Comparing the calendar
   dates as UTC removes the clock from the arithmetic entirely. */
function dayDiff(a,b){
  const A=Date.UTC(a.getFullYear(),a.getMonth(),a.getDate());
  const B=Date.UTC(b.getFullYear(),b.getMonth(),b.getDate());
  return Math.round((A-B)/86400000);}
function todayIdx(){const n=new Date();n.setHours(0,0,0,0);
 const s=new Date(START);s.setHours(0,0,0,0);
 const diff=dayDiff(n,s);
 if(diff<0)return{w:1,d:0};
 return{w:Math.min(WEEKS,Math.floor(diff/7)+1),d:Math.min(6,diff%7)};}
let VW,VD,PINNED=false;
(function(){const t=todayIdx();VW=t.w;VD=t.d;})();
function syncToday(){if(PINNED)return false;const t=todayIdx();
 if(t.w!==VW||t.d!==VD){VW=t.w;VD=t.d;return true;}return false;}
function goDay(w,d){const t=todayIdx();
 /* ROUND as well as clamp. Without the rounding, goDay(1.5) survives the
    clamp, PLAN[1.5] is undefined and the session card throws. */
 w=Math.round(Number(w)); if(!isFinite(w))w=1;
 d=Math.round(Number(d)); if(!isFinite(d))d=0;
 w=Math.max(1,Math.min(WEEKS,w));
 d=Math.max(0,Math.min(6,d));
 VW=w;VD=d;PINNED=!(w===t.w&&d===t.d);render();}
function goToday(){const t=todayIdx();VW=t.w;VD=t.d;PINNED=false;render();}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>{const n=parseFloat(v);return isNaN(n)?null:n;};
function toast(t){const e=document.createElement('div');e.textContent=t;
 e.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111;color:#FAF7F2;padding:11px 20px;border-radius:99px;font-size:13px;z-index:200;font-weight:600';
 document.body.appendChild(e);setTimeout(()=>e.remove(),1800);}

/* ---------- readiness composite. never a single metric. ---------- */
function baseline(field,upto){
 const vals=[];
 for(let w=1;w<=upto;w++)for(let d=0;d<7;d++){
  const r=S.d[key(w,d)]; if(r&&r.rec&&r.rec[field]!=null)vals.push(Number(r.rec[field]));}
 if(vals.length<5)return null;
 const use=vals.slice(-28);
 return use.reduce((a,b)=>a+b,0)/use.length;}
function readiness(w,d){
 const r=ds(w,d).rec, flags=[];
 const hrvB=baseline('hrv',w), rhrB=baseline('rhr',w);
 if(r.sleep!=null&&r.sleep<4)flags.push(['red','under 4 hours sleep']);
 else if(r.sleep!=null&&r.sleep<6)flags.push(['yellow','short sleep']);
 if(hrvB&&r.hrv!=null&&r.hrv<hrvB*0.85)flags.push(['yellow','HRV below your baseline']);
 if(rhrB&&r.rhr!=null&&r.rhr>rhrB+5)flags.push(['yellow','resting HR elevated']);
 if(r.energy!=null&&Number(r.energy)<=3)flags.push(['yellow','energy low']);
 if(r.sore!=null&&Number(r.sore)>=8)flags.push(['yellow','high soreness']);
 if(r.stress!=null&&Number(r.stress)>=9)flags.push(['yellow','stress very high']);
 if(ds(w,d).fu.migraine==='Yes')flags.push(['red','migraine reported']);
 if(ds(w,d).fu.symptoms==='Yes')flags.push(['red','unusual symptoms']);
 const reds=flags.filter(f=>f[0]==='red').length;
 const yellows=flags.filter(f=>f[0]==='yellow').length;
 const any=Object.keys(r).length>0;
 if(!any)return{lvl:'n',label:'NO DATA',flags:[]};
 if(reds>0||yellows>=3)return{lvl:'r',label:'RECOVER',flags};
 if(yellows>=1)return{lvl:'y',label:'REDUCE',flags};
 return{lvl:'g',label:'TRAIN',flags};}

 el.innerHTML=`<div class="card"><div class="eyebrow">Oura &middot; every morning</div>
 <h2>Recovery</h2>
 <div class="grid3" style="margin-top:13px">${m('ready','Readiness')}${m('score','Sleep score')}${m('sleep','Sleep hrs')}</div>
 <div class="grid3" style="margin-top:8px">${m('hrv','HRV')}${m('rhr','Resting HR')}${m('temp','Temp dev')}</div>
 ${sc('energy','Energy')}${sc('sore','Soreness')}${sc('motiv','Motivation')}${sc('stress','Stress')}
 <div class="info" style="margin-top:13px"><p>One bad night changes nothing. <span class="gold">I am reading the trend across the week</span>, and your baseline builds as you log.</p></div>
 </div>`;}

 ${yn('migraine','Migraine today')}

function editFood(){const cur=ds(VW,VD).fu.food||'';

 if(v==='')delete ds(VW,VD)[grp][k]; else ds(VW,VD)[grp][k]=v;

function clearNum(grp,k){delete ds(VW,VD)[grp][k];save();closeModal();render();}


/* ---------- weekly trend, the point of the whole app ---------- */
function weekAvg(w,grp,field){
 const v=[];for(let d=0;d<7;d++){const r=S.d[key(w,d)];
  if(r&&r[grp]&&r[grp][field]!=null&&r[grp][field]!=='')v.push(Number(r[grp][field]));}
 const ok=v.filter(x=>!isNaN(x));
 return ok.length?ok.reduce((a,b)=>a+b,0)/ok.length:null;}
function weekSum(w,grp,field){
 let t=0,n=0;for(let d=0;d<7;d++){const r=S.d[key(w,d)];
  if(r&&r[grp]&&r[grp][field]!=null){const x=Number(r[grp][field]);if(!isNaN(x)){t+=x;n++;}}}
 return n?t:null;}
function weekLoad(w){let t=0;for(let d=0;d<7;d++){const r=S.d[key(w,d)];
 if(r&&r.tr&&r.tr.dur&&r.tr.rpe){const x=Number(r.tr.dur)*Number(r.tr.rpe);if(!isNaN(x))t+=x;}}
 return t||null;}
function sessionsDone(w){let n=0;for(let d=0;d<7;d++){const r=S.d[key(w,d)];if(r&&r.done)n++;}return n;}

function weekCard(){const el=document.getElementById('weekCard');
 const prev=VW>1?VW-1:null;
 const rows=[
  ['Sessions done',   sessionsDone(VW), prev!=null?sessionsDone(prev):null, 'up',0],
  ['Training load',   weekLoad(VW),     prev!=null?weekLoad(prev):null,     'note',0],
  ['Aerobic minutes', weekSum(VW,'tr','dur'), prev!=null?weekSum(prev,'tr','dur'):null,'up',0],
  ['Distance, mi',    weekSum(VW,'tr','dist'),prev!=null?weekSum(prev,'tr','dist'):null,'up',1],
  ['Avg session RPE', weekAvg(VW,'tr','rpe'), prev!=null?weekAvg(prev,'tr','rpe'):null,'note',1],
  ['Avg HRV',         weekAvg(VW,'rec','hrv'),prev!=null?weekAvg(prev,'rec','hrv'):null,'up',0],
  ['Avg resting HR',  weekAvg(VW,'rec','rhr'),prev!=null?weekAvg(prev,'rec','rhr'):null,'down',0],
  ['Avg sleep, hrs',  weekAvg(VW,'rec','sleep'),prev!=null?weekAvg(prev,'rec','sleep'):null,'up',1],
  ['Avg readiness',   weekAvg(VW,'rec','ready'),prev!=null?weekAvg(prev,'rec','ready'):null,'up',0],
  ['Avg energy',      weekAvg(VW,'rec','energy'),prev!=null?weekAvg(prev,'rec','energy'):null,'up',1],
  ['Avg protein, g',  weekAvg(VW,'fu','protein'),prev!=null?weekAvg(prev,'fu','protein'):null,'up',0],
  ['Avg caffeine, mg',weekAvg(VW,'fu','caff'), prev!=null?weekAvg(prev,'fu','caff'):null,'note',0]
 ];
 const fmt=(v,dp)=>v==null?'\u00b7':Number(v).toFixed(dp);
 const arrow=(now,was,dir)=>{
  if(now==null||was==null)return '';
  const d=now-was; if(Math.abs(d)<0.001)return '<span class="flat">\u00b7</span>';
  const good=(dir==='up'&&d>0)||(dir==='down'&&d<0);
  if(dir==='note')return `<span class="flat">${d>0?'\u25B2':'\u25BC'}</span>`;
  return `<span class="${good?'up':'dn'}">${d>0?'\u25B2':'\u25BC'}</span>`;};
 el.innerHTML=`<div class="card"><div class="eyebrow">Week ${VW} against week ${VW>1?VW-1:'\u00b7'}</div>
 <h2>The trend</h2>
 <p class="sub">This is what decides the next block. Not how any single day felt.</p>
 <div style="margin-top:13px">
 ${rows.map(r=>`<div class="trend"><span>${r[0]}</span>
  <b>${fmt(r[1],r[4])} ${arrow(r[1],r[2],r[3])}</b></div>`).join('')}
 </div>
 <details class="more"><summary>What I am looking for</summary>
 <div class="info"><p><span class="gold">HRV up, resting HR down, sleep up, energy up, load up.</span> All five moving the right way means the engine is rebuilding and we add.</p>
 <p>Load up while HRV falls and energy drops is the exact pattern that ended the last two attempts. If I see it, we hold or we cut.</p>
 <p>Caffeine is tracked, not judged. I want to see it sitting next to your sleep, that is all.</p></div></details></div>`;}

function benchCard(){const el=document.getElementById('benchCard');
 const isB=[4,8,12,16].includes(VW);
 if(!isB){el.innerHTML='';return;}
 const b=S.wk[VW]||{};
 const f=(k,lab,ph)=>`<div class="form"><label>${lab}</label>
  <input type="text" value="${b[k]?esc(b[k]):''}" placeholder="${ph}" onchange="setBench('${k}',this.value)"></div>`;
 el.innerHTML=`<div class="card" style="border-color:rgba(138,111,52,.45);background:linear-gradient(140deg,#FFFBF2,#FFFFFF)">
 <div class="eyebrow">Week ${VW} &middot; benchmark</div>
 <h2>Where you actually are</h2>
 <div class="info"><p>Same conditions every time. Same route, similar weather, similar time of day, and <span class="gold">not the day after a hard session.</span></p>
 <p>Spread across two or three days. Everything in one day gives you a fatigue score, not a fitness score.</p></div>
 ${f('aero','Aerobic test, duration and avg HR','e.g. 30 min @ 152')}
 ${f('pace','Pace at that HR','e.g. 10:40/mi')}
 ${f('rpe','RPE at that effort','e.g. 4')}
 ${f('dl','Deadlift, 3 reps','e.g. 155 lb')}
 ${f('hrp','Hand-release push-ups in 2 min','e.g. 18')}
 ${f('plank','Plank hold','e.g. 2:10')}
 ${VW>=12?f('sdc','Sprint-drag-carry','e.g. 2:45'):''}
 ${VW>=12?f('run2','Two-mile run','e.g. 19:20'):''}
 <div class="flag"><p><span class="gold">Nothing maximal before week 8.</span> A max effort on an engine that is still rebuilding tells us what it cost, not what it can do.</p></div></div>`;}
function setBench(k,v){if(!S.wk[VW])S.wk[VW]={};S.wk[VW][k]=v;save();}

 <h2>AFT, layered on top</h2>
 <p class="sub">General fitness first, test-specific work second. That was your call and it is the right one.</p>
 <div style="margin-top:13px">
 ${[['3-rep max deadlift','Built by your strength days. Trap bar or conventional, 3 to 5 reps.'],
    ['Hand-release push-ups','Sub-maximal sets through the week beat one set to failure.'],
    ['Sprint-drag-carry','Rehearsed from week 9. The transitions cost more time than the legs do.'],

    ['Two-mile run','This is the aerobic build. It is the whole program, not a separate thing.']]
  .map(x=>`<div class="row"><div class="rb"><div class="rn">${x[0]}</div><div class="rm">${x[1]}</div></div></div>`).join('')}
 </div>
 <div class="info"><div class="ft">Your standard</div>
 <p>25S is Signal, not one of the designated combat specialties, so you are scored on the <span class="gold">general standard: 300 points total, minimum 60 on every single event</span>, on tables normed by sex and age.</p>
 <p>You are 34, which puts you in the <span class="gold">32 to 36 band</span> for the whole of this program. The plank is scored the same for men and women. The deadlift, push-ups, sprint-drag-carry and two-mile run are not.</p>

  <p class="sub" style="margin-top:4px">Put your four numbers in from the official scale for female, 32 to 36. I am not going to type a scoring table in here from memory and have you train to the wrong number.</p>
  <div class="grid2" style="margin-top:10px">${tg('mdl','Deadlift','lb')}${tg('hrp','Push-ups','reps')}</div>
  <div class="grid2" style="margin-top:8px">${tg('sdc','Sprint-drag-carry','m:ss')}${tg('run','Two-mile','m:ss')}</div>

function tg(k,lab,u){const v=(S.aft||{})[k];

function eduCard(){const el=document.getElementById('eduCard');
 el.innerHTML=`<div class="card"><div class="eyebrow">Why it is built this way</div>
 <h2>The reasoning</h2>
 <div class="info"><div class="ft">Why we start this far below what you could do</div>
 <p>You can almost certainly train harder than week 1 asks. That has never been the problem.</p>
 <p>Twice now you have come back, felt fine, built quickly, and then got ill or hit a wall. <span class="gold">The failure point is not the ceiling, it is the rate of climb.</span></p></div>
 <div class="info"><div class="ft">Why effort and not pace</div>
 <p>Your old easy pace belongs to an engine you had four years ago. Chasing it now means running every easy run too hard, which is exactly how the aerobic base never rebuilds.</p>
 <p>Pace is an outcome. Effort is the input. We control the input.</p></div>
 <div class="info"><div class="ft">Why one variable at a time</div>
 <p>Duration, then frequency, then intensity. Never two together.</p>
 <p>If something goes wrong we know which one caused it. Change two and you learn nothing.</p></div>
 <div class="info"><div class="ft">Why the food matters more than the training</div>
 <p>Your appetite is genuinely suppressed and your training is going up. Those two things pull in opposite directions.</p>
 <p><span class="gold">Underfuelled training is not training, it is just damage.</span> If one thing slips this block, do not let it be this one.</p></div></div>`;}

function render(){
 syncToday();
 const R=readiness(VW,VD);
 const p=document.getElementById('rdyPill');
 p.className='rdy '+R.lvl; p.textContent=R.label;
 [installCard,phaseCard,dayStrip,sessionCard,trainCard,recoveryCard,fuelCard,
  weekCard,benchCard,aftCard,eduCard].forEach(fn=>{
   try{fn();}catch(e){console.error('card failed:',fn.name,e);}});
}
render();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&syncToday())render();});
window.addEventListener('focus',()=>{if(syncToday())render();});
setInterval(()=>{if(syncToday())render();},60000);
</script></body></html>
