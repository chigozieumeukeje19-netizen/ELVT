name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5433:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Gates on the high severity count. DESIGN.md Part 3.
      - name: Design audit
        run: npm run design:audit

      # The design preview routes are development instrumentation. If a deploy
      # config ever turns them on, that is a live site serving them.
      - name: Preview routes stay out of deployed environments
        run: |
          # Scoped to the deploy surfaces. Playwright sets the flag for its own
          # server, which is the one place it belongs.
          if grep -n "ENABLE_DESIGN_PREVIEW" netlify.toml .env.example 2>/dev/null; then
            echo "This flag must never be set in a deploy config."
            exit 1
          fi
          echo "Preview flag is absent from every deploy surface."

      - name: Unit tests, schema and RLS
        run: npm test
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5433
          PGUSER: postgres

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
