name: Supabase keepalive

# A free tier Supabase project pauses itself after a week of no activity.
# This runs a trivial query every three days so ELVT OS PROD stays up.
#
# Set these two repository secrets before enabling:
#   PROD_SUPABASE_URL       https://<ref>.supabase.co
#   PROD_SUPABASE_ANON_KEY  the anon key for that project
#
# It only ever reads, and it reads a table that holds no client data.

on:
  schedule:
    # 09:00 UTC every third day of the month.
    - cron: "0 9 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the production project
        env:
          SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Secrets are not set yet. Nothing to ping."
            exit 0
          fi

          status=$(curl -sS -o /tmp/body -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/milestones?select=key&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")

          echo "HTTP $status"
          cat /tmp/body

          # RLS denies anon, and that is the correct answer. Any response at all
          # means the project is awake, which is the whole point.
          case "$status" in
            200|401|403) echo "Project is awake."; exit 0 ;;
            *) echo "Unexpected response."; exit 1 ;;
          esac
